# Curated Microsoft Foundry model deployments.
#
# Keep this list intentionally small. Refresh API-backed versions with:
#   uv run python infra/scripts/models.py preview
#   uv run python infra/scripts/models.py upgrade --apply
#
# Capacity values are conservative allocations, not the subscription maximum.
# Some entries are capped by per-model regional quota (see notes); check with
#   az cognitiveservices usage list --location <region>
# before raising sku.capacity.

  - name: gpt-5.4-mini
    sku:
      name: GlobalStandard
      capacity: 10
    model:
      format: OpenAI
      name: gpt-5.4-mini
      version: "2026-03-17"
    versionUpgradeOption: OnceCurrentVersionExpired
    notes: Default general-purpose model with a strong cost and latency balance.

